{% extends "base.html" %}

{% block title %}Access Logs - ZCAS University Library{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-history"></i> External Access Logs</h4>
                </div>
                <div class="card-body">
                    <!-- Summary Cards -->
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <div class="card bg-info text-white">
                                <div class="card-body text-center">
                                    <h5>Total Logs</h5>
                                    <h2 id="totalLogs">0</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-success text-white">
                                <div class="card-body text-center">
                                    <h5>Check Ins</h5>
                                    <h2 id="totalCheckIns">0</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-warning text-dark">
                                <div class="card-body text-center">
                                    <h5>Check Outs</h5>
                                    <h2 id="totalCheckOuts">0</h2>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Filter Panel -->
                    <div class="row mb-3">
                        <div class="col-md-2">
                            <label class="form-label">Status</label>
                            <select id="filterStatus" class="form-select">
                                <option value="all">All</option>
                                <option value="check_in">Check In</option>
                                <option value="check_out">Check Out</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Member (Name/ID)</label>
                            <input type="text" id="filterUser" class="form-control" placeholder="Search member...">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Card ID (RFID)</label>
                            <input type="text" id="filterCardId" class="form-control" placeholder="Search card ID...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Date From</label>
                            <input type="date" id="filterDateFrom" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Date To</label>
                            <input type="date" id="filterDateTo" class="form-control">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-12">
                            <button id="applyFilters" class="btn btn-primary">
                                <i class="fas fa-filter"></i> Apply Filters
                            </button>
                            <button id="clearFilters" class="btn btn-secondary">
                                <i class="fas fa-eraser"></i> Clear Filters
                            </button>
                            <button id="refreshLogs" class="btn btn-info">
                                <i class="fas fa-sync-alt"></i> Refresh
                            </button>
                        </div>
                    </div>

                    <!-- Logs Table -->
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Member ID</th>
                                    <th>Member Name</th>
                                    <th>Card ID</th>
                                    <th>Action</th>
                                    <th>Status</th>
                                    <th>Message</th>
                                </tr>
                            </thead>
                            <tbody id="logsTableBody">
                                <tr>
                                    <td colspan="7" class="text-center py-4">
                                        <div class="spinner-border text-primary"></div> Loading logs...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="row mt-3">
                        <div class="col-12">
                            <nav>
                                <ul class="pagination justify-content-center" id="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentPage = 1;
    let totalPages = 1;

    // Function to fetch logs with filters
    async function fetchLogs(page = 1) {
        const status = document.getElementById('filterStatus').value;
        const user = document.getElementById('filterUser').value;
        const cardId = document.getElementById('filterCardId').value;
        const dateFrom = document.getElementById('filterDateFrom').value;
        const dateTo = document.getElementById('filterDateTo').value;

        // Build query parameters
        const params = new URLSearchParams();
        params.append('page', page);
        params.append('per_page', 25);

        if (status !== 'all') params.append('status', status);
        if (user) params.append('user', user);
        if (cardId) params.append('card_id', cardId);
        if (dateFrom) params.append('date_from', dateFrom);
        if (dateTo) params.append('date_to', dateTo);

        try {
            const response = await fetch(`/api/access_logs?${params.toString()}`);
            const data = await response.json();

            if (data.success) {
                // Update summary
                if (data.summary) {
                    document.getElementById('totalLogs').textContent = data.summary.total || 0;
                    document.getElementById('totalCheckIns').textContent = data.summary.check_ins || 0;
                    document.getElementById('totalCheckOuts').textContent = data.summary.check_outs || 0;
                }

                // Update table
                updateTable(data.logs || []);

                // Update pagination
                if (data.pagination) {
                    currentPage = data.pagination.page;
                    totalPages = Math.ceil(data.pagination.total / data.pagination.per_page);
                    updatePagination();
                }
            } else {
                console.error('Error fetching logs:', data.error);
                showError('Failed to load logs');
            }
        } catch (error) {
            console.error('Error:', error);
            showError('Network error. Please try again.');
        }
    }

    // Update table with logs data
    function updateTable(logs) {
        const tbody = document.getElementById('logsTableBody');

        if (!logs || logs.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center text-muted py-4">
                        <i class="fas fa-inbox fa-3x mb-2 d-block"></i>
                        No logs found matching the filters
                    </td>
                </tr>
            `;
            return;
        }

        let html = '';
        for (const log of logs) {
            const actionBadge = log.action === 'check_in'
                ? '<span class="badge bg-success">✓ Check In</span>'
                : '<span class="badge bg-warning text-dark">✓ Check Out</span>';

            const statusBadge = log.status === 'success'
                ? '<span class="badge bg-success">Success</span>'
                : '<span class="badge bg-danger">Denied</span>';

            html += `
                <tr>
                    <td>${escapeHtml(log.timestamp)}</td>
                    <td><code>${escapeHtml(log.member_id)}</code></td>
                    <td><strong>${escapeHtml(log.member_name)}</strong></td>
                    <td><code>${escapeHtml(log.card_id)}</code></td>
                    <td>${actionBadge}</td>
                    <td>${statusBadge}</td>
                    <td>${escapeHtml(log.message || '—')}</td>
                </tr>
            `;
        }
        tbody.innerHTML = html;
    }

    // Update pagination controls
    function updatePagination() {
        const paginationEl = document.getElementById('pagination');

        if (totalPages <= 1) {
            paginationEl.innerHTML = '';
            return;
        }

        let html = '';

        // Previous button
        html += `
            <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <button class="page-link" onclick="goToPage(${currentPage - 1})">« Previous</button>
            </li>
        `;

        // Page numbers
        const startPage = Math.max(1, currentPage - 2);
        const endPage = Math.min(totalPages, currentPage + 2);

        if (startPage > 1) {
            html += `<li class="page-item"><button class="page-link" onclick="goToPage(1)">1</button></li>`;
            if (startPage > 2) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
        }

        for (let i = startPage; i <= endPage; i++) {
            html += `
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <button class="page-link" onclick="goToPage(${i})">${i}</button>
                </li>
            `;
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            html += `<li class="page-item"><button class="page-link" onclick="goToPage(${totalPages})">${totalPages}</button></li>`;
        }

        // Next button
        html += `
            <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                <button class="page-link" onclick="goToPage(${currentPage + 1})">Next »</button>
            </li>
        `;

        paginationEl.innerHTML = html;
    }

    // Go to specific page
    function goToPage(page) {
        if (page >= 1 && page <= totalPages && page !== currentPage) {
            currentPage = page;
            fetchLogs(currentPage);
        }
    }

    // Apply filters (reset to page 1)
    function applyFilters() {
        currentPage = 1;
        fetchLogs(1);
    }

    // Clear all filters
    function clearFilters() {
        document.getElementById('filterStatus').value = 'all';
        document.getElementById('filterUser').value = '';
        document.getElementById('filterCardId').value = '';
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        currentPage = 1;
        fetchLogs(1);
    }

    // Show error message
    function showError(message) {
        const tbody = document.getElementById('logsTableBody');
        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="text-center text-danger py-4">
                    <i class="fas fa-exclamation-triangle fa-2x mb-2 d-block"></i>
                    ${escapeHtml(message)}
                </td>
            </tr>
        `;
    }

    // Escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function (m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Event listeners
    document.getElementById('applyFilters').addEventListener('click', applyFilters);
    document.getElementById('clearFilters').addEventListener('click', clearFilters);
    document.getElementById('refreshLogs').addEventListener('click', () => fetchLogs(currentPage));

    // Enter key support
    const filterInputs = ['filterUser', 'filterCardId', 'filterDateFrom', 'filterDateTo'];
    filterInputs.forEach(id => {
        document.getElementById(id).addEventListener('keypress', (e) => {
            if (e.key === 'Enter') applyFilters();
        });
    });

    // Initial load
    fetchLogs(1);
</script>

<style>
    .page-link {
        cursor: pointer;
    }

    .table-responsive {
        max-height: 500px;
        overflow-y: auto;
    }

    .table th {
        position: sticky;
        top: 0;
        background: #f8f9fa;
        z-index: 10;
    }

    code {
        background: #f1f3f4;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.85rem;
    }
</style>
{% endblock %}
