{% extends "base.html" %}

{% block title %}Access Logs{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <div class="d-flex align-items-center">
        <i class="fas fa-history fa-2x me-3 text-primary"></i>
        <h1 class="h2 mb-0">Access Logs</h1>
    </div>
    <div class="btn-toolbar mb-2 mb-md-0">
        <button onclick="window.print();" class="btn btn-sm btn-outline-secondary me-2">
            <i class="fas fa-print"></i> Print
        </button>
        <button onclick="refreshLogs();" class="btn btn-sm btn-primary">
            <i class="fas fa-sync-alt"></i> Refresh
        </button>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">
                    <i class="fas fa-list me-2"></i>Member Access Records
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="logsTable">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Member ID</th>
                                <th>Member Name</th>
                                <th>Action</th>
                                <th>Status</th>
                                <th>Message</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="6" class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-2">Loading access logs...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Summary Cards -->
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card shadow-sm border-success">
            <div class="card-body text-center">
                <i class="fas fa-sign-in-alt fa-2x text-success mb-2"></i>
                <h3 id="totalCheckIns" class="mb-0">0</h3>
                <p class="text-muted mb-0">Total Check-ins</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm border-warning">
            <div class="card-body text-center">
                <i class="fas fa-sign-out-alt fa-2x text-warning mb-2"></i>
                <h3 id="totalCheckOuts" class="mb-0">0</h3>
                <p class="text-muted mb-0">Total Check-outs</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm border-danger">
            <div class="card-body text-center">
                <i class="fas fa-ban fa-2x text-danger mb-2"></i>
                <h3 id="totalDenied" class="mb-0">0</h3>
                <p class="text-muted mb-0">Access Denied</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Load access logs
    async function loadAccessLogs() {
        try {
            const response = await fetch('/api/access_logs');
            const data = await response.json();

            if (data.success) {
                const tbody = document.querySelector('#logsTable tbody');
                let checkIns = 0;
                let checkOuts = 0;
                let denied = 0;

                if (data.logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No access logs found</td></tr>';
                } else {
                    tbody.innerHTML = '';
                    data.logs.forEach(log => {
                        const row = tbody.insertRow();

                        // Action badge
                        let actionBadge = '';
                        if (log.action === 'check_in') {
                            actionBadge = '<span class="badge bg-success"><i class="fas fa-sign-in-alt"></i> Check In</span>';
                            checkIns++;
                        } else if (log.action === 'check_out') {
                            actionBadge = '<span class="badge bg-warning"><i class="fas fa-sign-out-alt"></i> Check Out</span>';
                            checkOuts++;
                        }

                        // Status badge
                        let statusBadge = '';
                        if (log.status === 'success') {
                            statusBadge = '<span class="badge bg-success">Success</span>';
                        } else if (log.status === 'denied') {
                            statusBadge = '<span class="badge bg-danger">Denied</span>';
                            denied++;
                        } else {
                            statusBadge = '<span class="badge bg-secondary">' + log.status + '</span>';
                        }

                        row.insertCell(0).innerHTML = log.timestamp;
                        row.insertCell(1).innerHTML = '<code>' + log.member_id + '</code>';
                        row.insertCell(2).innerHTML = log.member_name;
                        row.insertCell(3).innerHTML = actionBadge;
                        row.insertCell(4).innerHTML = statusBadge;
                        row.insertCell(5).innerHTML = log.message || '-';
                    });
                }

                // Update summary
                document.getElementById('totalCheckIns').textContent = checkIns;
                document.getElementById('totalCheckOuts').textContent = checkOuts;
                document.getElementById('totalDenied').textContent = denied;
            } else {
                showError(data.error || 'Failed to load logs');
            }
        } catch (error) {
            console.error('Error loading logs:', error);
            showError('Network error. Please refresh the page.');
        }
    }

    function showError(message) {
        const tbody = document.querySelector('#logsTable tbody');
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger"><i class="fas fa-exclamation-triangle"></i> ${message}</td></tr>`;
    }

    function refreshLogs() {
        loadAccessLogs();
    }

    // Auto-refresh every 30 seconds
    document.addEventListener('DOMContentLoaded', function () {
        loadAccessLogs();
        setInterval(loadAccessLogs, 30000);
    });
</script>

<style>
    .table td,
    .table th {
        vertical-align: middle;
    }

    code {
        font-size: 0.85rem;
    }
</style>
{% endblock %}
