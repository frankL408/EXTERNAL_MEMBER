<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Library Access Logs | ZCAS University RFID System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #f0f2f8;
            font-family: 'Segoe UI', Roboto, system-ui;
            padding: 24px 20px;
        }

        .logs-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .card-custom {
            border-radius: 24px;
            border: none;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            transition: all 0.2s;
            background: white;
        }

        .card-header-custom {
            background: white;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding: 1.2rem 1.5rem;
            font-weight: 700;
            font-size: 1.3rem;
            border-radius: 24px 24px 0 0 !important;
        }

        .summary-stats {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
        }

        .stat-card {
            background: white;
            border-radius: 28px;
            padding: 1rem 1.8rem;
            flex: 1;
            min-width: 150px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.03);
            border: 1px solid #eef2f6;
            transition: 0.2s;
        }

        .stat-card i {
            font-size: 2rem;
            margin-right: 12px;
            color: #1E3A8A;
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.2;
            color: #0b2b4f;
        }

        .filter-bar {
            background: #f8fafd;
            padding: 1.2rem 1.5rem;
            border-radius: 32px;
            margin-bottom: 1.8rem;
            border: 1px solid #e2e8f0;
        }

        .btn-outline-custom {
            border-radius: 40px;
            padding: 0.45rem 1.2rem;
            font-weight: 500;
        }

        .btn-primary-custom {
            background: #1E3A8A;
            border: none;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            font-weight: 500;
            transition: 0.2s;
        }

        .btn-primary-custom:hover {
            background: #0f2b6d;
            transform: translateY(-1px);
        }

        .btn-secondary-custom {
            background: #e9ecef;
            border: none;
            color: #2c3e66;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
        }

        .logs-table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
        }

        .table-logs {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-logs th {
            background: #f1f5f9;
            padding: 1rem 1rem;
            font-weight: 600;
            color: #1e2f4e;
            border-bottom: 1px solid #dee2e6;
        }

        .table-logs td {
            padding: 0.9rem 1rem;
            vertical-align: middle;
            border-bottom: 1px solid #edf2f7;
        }

        .badge-status {
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-check-in {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-check-out {
            background: #ffedd5;
            color: #9b4a0b;
        }

        .back-btn {
            transition: 0.2s;
            border-radius: 60px;
            background: white;
            border: 1px solid #cbd5e1;
            color: #1e3a8a;
        }

        .back-btn:hover {
            background: #f1f5f9;
            transform: translateX(-3px);
        }

        .clear-btn {
            background: #fff1f0;
            border: 1px solid #ffcdca;
            color: #b91c1c;
        }

        .apply-btn {
            background: #1e3a8a;
            color: white;
        }

        @media (max-width: 768px) {
            .stat-card {
                padding: 0.8rem 1rem;
            }

            .stat-number {
                font-size: 1.5rem;
            }

            .filter-bar .row>div {
                margin-bottom: 10px;
            }
        }

        .empty-logs {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }

        .rfid-badge {
            font-family: monospace;
            background: #eef2ff;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="logs-container">
        <!-- header with back to scan button & title -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1" style="color:#0b2b4f;"><i class="fas fa-history me-2"
                        style="color:#1E3A8A;"></i>External Access Logs</h2>
                <p class="text-muted">Library entries & exits · full history with summaries</p>
            </div>
            <button class="btn back-btn px-4 py-2" id="backToScanBtn">
                <i class="fas fa-arrow-left me-2"></i> Back to Scan ID
            </button>
        </div>

        <!-- summary cards (total logs, check-ins, check-outs) -->
        <div class="summary-stats" id="summaryStatsArea">
            <div class="stat-card"><i class="fas fa-database"></i>
                <div><span class="stat-number" id="totalLogsCount">0</span>
                    <div class="text-muted small">Total Logs</div>
                </div>
            </div>
            <div class="stat-card"><i class="fas fa-sign-in-alt text-success"></i>
                <div><span class="stat-number text-success" id="totalCheckIns">0</span>
                    <div class="text-muted small">Check Ins</div>
                </div>
            </div>
            <div class="stat-card"><i class="fas fa-sign-out-alt text-warning"></i>
                <div><span class="stat-number text-warning" id="totalCheckOuts">0</span>
                    <div class="text-muted small">Check Outs</div>
                </div>
            </div>
        </div>

        <!-- filter panel -->
        <div class="filter-bar">
            <div class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="form-label fw-semibold"><i class="fas fa-tag"></i> Status</label>
                    <select class="form-select" id="filterStatus">
                        <option value="all">All</option>
                        <option value="check_in">Check In</option>
                        <option value="check_out">Check Out</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold"><i class="fas fa-user"></i> Username / Member</label>
                    <input type="text" class="form-control" id="filterUser" placeholder="Member name or ID">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold"><i class="fas fa-microchip"></i> Card ID (RFID)</label>
                    <input type="text" class="form-control" id="filterCardId" placeholder="RFID UID">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold"><i class="far fa-calendar-alt"></i> Date From</label>
                    <input type="date" class="form-control" id="filterDateFrom">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold"><i class="far fa-calendar-alt"></i> Date To</label>
                    <input type="date" class="form-control" id="filterDateTo">
                </div>
                <div class="col-md-1 d-flex gap-2">
                    <button class="btn apply-btn w-100" id="applyFiltersBtn"><i class="fas fa-filter"></i>
                        Apply</button>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12 d-flex justify-content-end gap-2">
                    <button class="btn clear-btn" id="clearFiltersBtn"><i class="fas fa-undo-alt"></i> Clear
                        Filters</button>
                </div>
            </div>
        </div>

        <!-- logs table -->
        <div class="card-custom">
            <div class="card-header-custom d-flex justify-content-between align-items-center flex-wrap">
                <span><i class="fas fa-list-ul me-2"></i> Detailed Log Entries</span>
                <span class="text-muted small" id="logsCountIndicator">showing 0 records</span>
            </div>
            <div class="logs-table-wrapper p-3 pt-0">
                <table class="table-logs table-hover" id="logsTable">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Member Name / ID</th>
                            <th>Card ID (RFID)</th>
                            <th>Status</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td colspan="5" class="text-center py-5">Loading logs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ---------- MOCK DATA: Extended library logs for demonstration (external history) ----------
        // This simulates backend logs with full member info, RFID, status, timestamps.
        // In real environment, replace with API fetch('/api/external_logs') but we generate realistic dataset for full filtering demo.
        let allLogs = [];

        // Helper: random date between two dates (last 30 days)
        function randomDate(start, end) {
            return new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
        }
        function formatDateTime(date) {
            const pad = (n) => n.toString().padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        // Members and cards pool for realistic mock
        const membersPool = [
            { member_id: "M21045", full_name: "Alice Chanda", nrc: "123456/10/1", rfid: "0A1B2C3D4E" },
            { member_id: "M21089", full_name: "Brian Mwila", nrc: "234567/11/2", rfid: "1B2C3D4E5F" },
            { member_id: "M21123", full_name: "Catherine Banda", nrc: "345678/12/3", rfid: "2C3D4E5F6G" },
            { member_id: "M21167", full_name: "David Phiri", nrc: "456789/13/4", rfid: "3D4E5F6G7H" },
            { member_id: "M21201", full_name: "Ester Mwansa", nrc: "567890/14/5", rfid: "4E5F6G7H8I" },
            { member_id: "M21244", full_name: "Frank Lungu", nrc: "678901/15/6", rfid: "5F6G7H8I9J" },
            { member_id: "M21288", full_name: "Grace Zulu", nrc: "789012/16/7", rfid: "6G7H8I9J0K" }
        ];

        // generate 120 logs (mixed check_in/out, dates across last 30 days)
        function generateMockLogs() {
            const logs = [];
            const now = new Date();
            const pastDate = new Date(); pastDate.setDate(now.getDate() - 35);
            for (let i = 0; i < 135; i++) {
                const member = membersPool[i % membersPool.length];
                const rfidCard = member.rfid;
                const randStatus = Math.random() > 0.48 ? 'check_in' : 'check_out'; // balanced
                const eventDate = randomDate(pastDate, now);
                // add some random minutes offset to timestamps
                let checkTime = new Date(eventDate);
                // optional extra unique id
                const logId = i + 1000;
                logs.push({
                    id: logId,
                    timestamp: formatDateTime(checkTime),
                    isoDate: checkTime.toISOString(),
                    member_name: member.full_name,
                    member_id: member.member_id,
                    card_id: rfidCard,
                    status: randStatus,
                    details: randStatus === 'check_in' ? 'Access granted → library entry' : 'Exit recorded → library departure'
                });
            }
            // sort by timestamp descending (newest first)
            logs.sort((a, b) => new Date(b.isoDate) - new Date(a.isoDate));
            return logs;
        }

        // initial load of logs (mimics external api)
        let masterLogs = generateMockLogs();

        // Helper to compute summary
        function computeSummary(filteredLogs) {
            const total = filteredLogs.length;
            const checkIns = filteredLogs.filter(l => l.status === 'check_in').length;
            const checkOuts = filteredLogs.filter(l => l.status === 'check_out').length;
            return { total, checkIns, checkOuts };
        }

        // update summary cards (using filtered logs for dynamic summary)
        function updateSummaryUI(filteredData) {
            const summary = computeSummary(filteredData);
            document.getElementById('totalLogsCount').innerText = summary.total;
            document.getElementById('totalCheckIns').innerText = summary.checkIns;
            document.getElementById('totalCheckOuts').innerText = summary.checkOuts;
            document.getElementById('logsCountIndicator').innerHTML = `<i class="far fa-file-alt"></i> ${summary.total} records`;
        }

        // render table rows
        function renderLogsTable(logsArray) {
            const tbody = document.getElementById('logsTableBody');
            if (!logsArray.length) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-logs"><i class="fas fa-inbox fa-2x mb-2 d-block"></i>No logs match filters</td></tr>`;
                return;
            }
            let html = '';
            logsArray.forEach(log => {
                const statusBadge = log.status === 'check_in'
                    ? '<span class="badge-status badge-check-in"><i class="fas fa-sign-in-alt me-1"></i> Check In</span>'
                    : '<span class="badge-status badge-check-out"><i class="fas fa-sign-out-alt me-1"></i> Check Out</span>';
                html += `<tr>
                <td style="white-space: nowrap;"><i class="far fa-clock text-muted me-1"></i> ${escapeHtml(log.timestamp)}</td>
                <td><strong>${escapeHtml(log.member_name)}</strong><br><small class="text-muted">${escapeHtml(log.member_id)}</small></td>
                <td><span class="rfid-badge"><i class="fas fa-microchip me-1"></i> ${escapeHtml(log.card_id)}</span></td>
                <td>${statusBadge}</td>
                <td class="text-muted small">${escapeHtml(log.details)}</td>
            </tr>`;
            });
            tbody.innerHTML = html;
        }

        // Filter logic based on status, user, card ID, dateFrom, dateTo
        function applyFilters() {
            const statusVal = document.getElementById('filterStatus').value;
            const userVal = document.getElementById('filterUser').value.trim().toLowerCase();
            const cardVal = document.getElementById('filterCardId').value.trim().toLowerCase();
            const dateFromVal = document.getElementById('filterDateFrom').value;
            const dateToVal = document.getElementById('filterDateTo').value;

            let filtered = [...masterLogs];

            // status filter
            if (statusVal !== 'all') {
                filtered = filtered.filter(log => log.status === statusVal);
            }

            // user filter (match member name OR member id)
            if (userVal !== '') {
                filtered = filtered.filter(log =>
                    log.member_name.toLowerCase().includes(userVal) ||
                    log.member_id.toLowerCase().includes(userVal)
                );
            }

            // card ID filter
            if (cardVal !== '') {
                filtered = filtered.filter(log => log.card_id.toLowerCase().includes(cardVal));
            }

            // date from filter (timestamp string format YYYY-MM-DD HH:MM:SS)
            if (dateFromVal) {
                const fromDate = new Date(dateFromVal);
                fromDate.setHours(0, 0, 0, 0);
                filtered = filtered.filter(log => {
                    const logDate = new Date(log.isoDate);
                    return logDate >= fromDate;
                });
            }
            // date to filter
            if (dateToVal) {
                const toDate = new Date(dateToVal);
                toDate.setHours(23, 59, 59, 999);
                filtered = filtered.filter(log => {
                    const logDate = new Date(log.isoDate);
                    return logDate <= toDate;
                });
            }

            // update UI: summary + table
            updateSummaryUI(filtered);
            renderLogsTable(filtered);
        }

        // clear all filters
        function clearFilters() {
            document.getElementById('filterStatus').value = 'all';
            document.getElementById('filterUser').value = '';
            document.getElementById('filterCardId').value = '';
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            // reset to full logs
            updateSummaryUI(masterLogs);
            renderLogsTable(masterLogs);
        }

        // escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function (c) {
                return c;
            });
        }

        // additional function to refresh data (optional real API integration stub)
        // For now everything uses mock, but you can extend to fetch real logs if endpoint exists.
        async function fetchLatestLogsFromBackend() {
            // In real integration: GET /api/external_logs?<params> or full history
            // For demonstration, we just keep mock but you can simulate dynamic addition by calling:
            // but since we must preserve external log history with filter, we provide a function to dynamically add a log when scanning in main scanner.
            // We will expose a method to add a new log record if needed from parent window? 
            // but here we are on separate logs page: we can simulate no new logs but ready.
            // However, we can maintain masterLogs and also support localStorage or session sync? but not needed.
            // For consistency, we provide a reload function but not necessary.
            console.log("Logs ready. Use filters.");
        }

        // "Back to scan ID" button redirection: use relative link to main scanner (index or root)
        document.getElementById('backToScanBtn').addEventListener('click', function (e) {
            // redirect to the main RFID scanner page (assuming it's the same domain root or /)
            // In production, may be '/' or '/scanner', we target the scanner interface provided in the context.
            // Since the requested environment probably includes Flask routes: we can go to '/' or '/'
            window.location.href = '/';   // or './' to return to main scanning interface
        });

        // Apply filters button
        document.getElementById('applyFiltersBtn').addEventListener('click', applyFilters);
        document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);

        // additionally allow "enter" key on input fields for convenience
        const filterInputs = ['filterUser', 'filterCardId', 'filterDateFrom', 'filterDateTo'];
        filterInputs.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('keypress', function (e) { if (e.key === 'Enter') applyFilters(); });
        });
        // also status select enter not needed but fine.

        // initial render
        function init() {
            // ensure all logs are sorted newest first
            masterLogs.sort((a, b) => new Date(b.isoDate) - new Date(a.isoDate));
            updateSummaryUI(masterLogs);
            renderLogsTable(masterLogs);
            // optional: set default date range hints? not required
        }
        init();

        // ---- EXTRA: Simulate external new log addition (to demonstrate dynamic update if user scans new card) ----
        // For real integration, you can call this method from parent or use polling. But not mandatory.
        // However, to replicate robust external log history with updates, we provide a function that can be called from scanner iframe/event.
        // This function adds a new entry and refreshes UI without losing filters? but we will keep consistent behavior.
        window.addNewLibraryLog = function (scanData) {
            // scanData = { member_name, member_id, card_id, status, timestamp }
            if (!scanData) return;
            const newLog = {
                id: Date.now(),
                timestamp: scanData.timestamp || new Date().toLocaleString(),
                isoDate: new Date().toISOString(),
                member_name: scanData.member_name || 'Unknown',
                member_id: scanData.member_id || 'N/A',
                card_id: scanData.card_id || 'unknown',
                status: scanData.status || 'check_in',
                details: scanData.status === 'check_in' ? 'Access granted → library entry' : 'Exit recorded → library departure'
            };
            masterLogs.unshift(newLog); // add to beginning (newest)
            // reapply current filters to show updated list respecting active filters
            applyFilters(); // this will apply current filter panel values & reflect new log if matches
            // update summary for current filtered view
        };

        // For demo, we also listen to possible messages from parent window in case scanner is embedded
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'NEW_SCAN_LOG') {
                addNewLibraryLog(event.data.payload);
            }
        });
        // expose clear & apply also globally for console debugging
        window.logsAPI = { applyFilters, clearFilters, addNewLibraryLog };
    </script>

    <!-- additional note: the external log history includes summary + fully functional filtering and back button -->
</body>

</html>
