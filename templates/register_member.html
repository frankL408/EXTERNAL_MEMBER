{% extends "base.html" %}

{% block title %}Register New Member - ZCAS University Library{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-user-plus"></i> Register New Member</h4>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data" id="registrationForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="full_name" class="form-label">Full Name *</label>
                                <input type="text" class="form-control" id="full_name" name="full_name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">Phone Number *</label>
                                <input type="tel" class="form-control" id="phone" name="phone" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="nrc_number" class="form-label">NRC Number *</label>
                                <input type="text" class="form-control" id="nrc_number" name="nrc_number" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Address *</label>
                            <textarea class="form-control" id="address" name="address" rows="2" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nationality" class="form-label">Nationality</label>
                                <select class="form-select" id="nationality" name="nationality">
                                    <option value="Zambian">Zambian</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="membership_type" class="form-label">Membership Type *</label>
                                <select class="form-select" id="membership_type" name="membership_type" required>
                                    <option value="monthly">Monthly (K90/month)</option>
                                    <option value="six_months">Six Months (K500)</option>
                                    <option value="external">External Member (K100/month)</option>
                                </select>
                            </div>
                        </div>

                        <div class="row" id="durationSection">
                            <div class="col-md-6 mb-3">
                                <label for="duration_months" class="form-label">Duration (Months)</label>
                                <select class="form-select" id="duration_months" name="duration_months">
                                    <option value="1">1 month</option>
                                    <option value="2">2 months</option>
                                    <option value="3">3 months</option>
                                    <option value="4">4 months</option>
                                    <option value="5">5 months</option>
                                    <option value="6">6 months</option>
                                    <option value="7">7 months</option>
                                    <option value="8">8 months</option>
                                    <option value="9">9 months</option>
                                    <option value="10">10 months</option>
                                    <option value="11">11 months</option>
                                    <option value="12">12 months</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="payment_method" class="form-label">Payment Method</label>
                                <select class="form-select" id="payment_method" name="payment_method">
                                    <option value="Cash">Cash</option>
                                    <option value="Card">Card</option>
                                    <option value="Mobile Money">Mobile Money</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="photo" class="form-label">Profile Photo</label>
                            <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
                            <small class="text-muted">Optional. Upload a passport-size photo.</small>
                        </div>

                        <div class="alert alert-info" id="feeDisplay">
                            <strong>Fee Summary:</strong>
                            <span id="feeAmount">Calculating...</span>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Register Member
                            </button>
                            <a href="{{ url_for('view_members') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Calculate and display fee based on membership type and duration
    function calculateFee() {
        const membershipType = document.getElementById('membership_type').value;
        let duration = parseInt(document.getElementById('duration_months').value) || 1;

        let membershipFee = 0;
        let idCardFee = 100;
        let wifiFee = 120;

        if (membershipType === 'monthly') {
            membershipFee = 90 * duration;
        } else if (membershipType === 'six_months') {
            membershipFee = 500;
            duration = 6;
        } else if (membershipType === 'external') {
            membershipFee = 100 * duration;
        }

        const total = membershipFee + idCardFee + wifiFee;

        document.getElementById('feeAmount').innerHTML = `
            <strong>Membership Fee:</strong> K${membershipFee}<br>
            <strong>ID Card Fee:</strong> K${idCardFee}<br>
            <strong>WiFi Fee:</strong> K${wifiFee}<br>
            <strong>Total:</strong> K${total}
        `;
    }

    // Show/hide duration selector based on membership type
    function toggleDuration() {
        const membershipType = document.getElementById('membership_type').value;
        const durationSection = document.getElementById('durationSection');

        if (membershipType === 'six_months') {
            durationSection.style.display = 'none';
            document.getElementById('duration_months').value = 6;
        } else {
            durationSection.style.display = 'flex';
        }
        calculateFee();
    }

    // Event listeners
    document.getElementById('membership_type').addEventListener('change', toggleDuration);
    document.getElementById('duration_months').addEventListener('change', calculateFee);

    // Initial calculation
    toggleDuration();
</script>
{% endblock %}
