<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ZCAS Library | External Entrance Scan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(145deg, #0B2B4F 0%, #1E3A8A 100%);
            min-height: 100vh;
            padding: 1.5rem;
            font-family: 'Segoe UI', system-ui, 'Poppins', sans-serif;
        }

        .entrance-wrapper {
            max-width: 600px;
            margin: 0 auto;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: none;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .header-grad {
            background: linear-gradient(135deg, #0F2B6D, #1E3A8A);
            padding: 1.8rem 1.5rem;
            text-align: center;
            border-bottom: 3px solid #FFC107;
        }

        .scan-icon {
            font-size: 3.5rem;
            background: white;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.8rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            color: #1E3A8A;
        }

        .member-photo-area {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #f1f5f9;
            border: 4px solid #FFC107;
            margin: 0 auto 1rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
            transition: 0.2s;
        }

        .member-photo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-card {
            border-radius: 32px;
            padding: 1rem;
            transition: all 0.25s ease;
        }

        .badge-check {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 60px;
        }

        .btn-scan-primary {
            background: #1E3A8A;
            border: none;
            border-radius: 60px;
            padding: 12px 20px;
            font-weight: 600;
            transition: 0.2s;
            color: white;
            width: 100%;
        }

        .btn-scan-primary:hover {
            background: #0f2d6b;
            transform: scale(0.98);
        }

        .btn-outline-scan {
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            background: white;
            color: #1E3A8A;
        }

        .input-lg {
            border-radius: 60px;
            padding: 14px 20px;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 1px;
            font-family: monospace;
            font-weight: 500;
            background: #fefce8;
            border: 1px solid #e2e8f0;
        }

        .input-lg:focus {
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.2);
            border-color: #1E3A8A;
        }

        .action-bell {
            animation: gentlePulse 1s ease;
        }

        @keyframes gentlePulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.02);
                background: #e6f0ff;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .current-status-badge {
            font-size: 0.8rem;
            background: #eef2ff;
            border-radius: 30px;
            padding: 4px 12px;
        }

        .footer-note {
            background: #f8fafc;
            border-radius: 30px;
            padding: 12px;
            font-size: 0.75rem;
            text-align: center;
        }

        @media (max-width: 550px) {
            body {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="entrance-wrapper">
        <!-- MAIN SCAN CARD -->
        <div class="glass-card mb-4">
            <div class="header-grad text-white">
                <div class="scan-icon mx-auto">
                    <i class="fas fa-id-card"></i>
                </div>
                <h3 class="fw-bold mb-0">External Library Access</h3>
                <p class="mb-0 small opacity-75">ZCAS University • RFID / External ID Scan</p>
            </div>
            <div class="card-body p-4">
                <!-- External ID / scanned card input -->
                <label class="form-label fw-semibold"><i class="fas fa-microchip me-1"></i> External Card ID / Member
                    Number</label>
                <div class="input-group mb-3">
                    <span class="input-group-text bg-white"><i class="fas fa-rss text-primary"></i></span>
                    <input type="text" class="form-control input-lg" id="externalScanInput"
                        placeholder="Scan or type External ID (e.g., EXT2025001)" autofocus>
                </div>
                <div class="d-grid gap-2 d-md-flex justify-content-md-between mb-3">
                    <button class="btn btn-scan-primary" id="submitScanBtn">
                        <i class="fas fa-fingerprint me-2"></i> Process Entry / Exit
                    </button>
                    <button class="btn btn-outline-secondary btn-outline-scan" id="clearScanBtn">
                        <i class="fas fa-eraser"></i> Clear
                    </button>
                </div>
                <div id="resultPanel" style="display: none;"></div>

                <!-- quick info -->
                <div class="footer-note mt-3">
                    <i class="fas fa-info-circle text-primary me-1"></i>
                    Use your library card ID (External ID) or tap RFID reader connected. System automatically checks IN
                    or OUT.
                </div>
            </div>
        </div>

        <!-- CURRENTLY INSIDE SUMMARY & QUICK LOGS -->
        <div class="glass-card">
            <div
                class="card-header-custom bg-white border-bottom p-3 d-flex justify-content-between align-items-center">
                <h6 class="mb-0 fw-bold"><i class="fas fa-door-open text-success me-2"></i> Currently Inside Library
                </h6>
                <a href="{{ url_for('access_logs') }}" target="_blank" class="text-decoration-none small"
                    id="viewFullLogsLink">
                    <i class="fas fa-chart-line"></i> View logs
                </a>
            </div>
            <div class="card-body p-0">
                <div id="currentInsideList" class="p-3" style="max-height: 280px; overflow-y: auto;">
                    <div class="text-center py-4 text-muted">
                        <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                        <p>Loading active members...</p>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-between p-3 border-top bg-light">
                <span class="small"><i class="far fa-clock"></i> Real-time feed</span>
                <button class="btn btn-sm btn-link text-primary" id="refreshInsideBtn"><i class="fas fa-sync-alt"></i>
                    Refresh</button>
            </div>
        </div>
    </div>

    <script>
        // --- Helper: Audio feedback (optional)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx && window.AudioContext) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playBeep(type = 'success') {
            try {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                if (type === 'check_in') {
                    osc.frequency.value = 880;
                    gain.gain.value = 0.25;
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
                    osc.stop(audioCtx.currentTime + 0.35);
                } else if (type === 'check_out') {
                    osc.frequency.value = 660;
                    gain.gain.value = 0.25;
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
                    osc.stop(audioCtx.currentTime + 0.4);
                } else {
                    osc.frequency.value = 450;
                    gain.gain.value = 0.2;
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                    osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch (e) { console.log("audio error", e); }
        }

        // DOM refs
        const scanInput = document.getElementById('externalScanInput');
        const submitBtn = document.getElementById('submitScanBtn');
        const clearBtn = document.getElementById('clearScanBtn');
        const resultPanel = document.getElementById('resultPanel');
        const currentInsideDiv = document.getElementById('currentInsideList');
        const refreshBtn = document.getElementById('refreshInsideBtn');

        // Utility: escape html
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function (c) { return c; });
        }

        // format date/time
        function formatTime(isoOrDate) {
            try {
                let d = new Date(isoOrDate);
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch (e) { return ''; }
        }

        // Fetch current members inside library using /api/current_members
        async function loadCurrentInside() {
            try {
                const response = await fetch('/api/current_members');
                const data = await response.json();
                if (data.success && data.members) {
                    if (data.members.length === 0) {
                        currentInsideDiv.innerHTML = `<div class="text-center py-4 text-muted"><i class="fas fa-door-closed fa-2x mb-2"></i><p>Library is empty. No members inside.</p></div>`;
                        return;
                    }
                    let html = `<div class="list-group list-group-flush">`;
                    data.members.forEach(member => {
                        const photoHtml = member.photo_path ?
                            `<img src="/static/uploads/${member.photo_path}" class="rounded-circle me-2" width="38" height="38" style="object-fit:cover;" onerror="this.src='https://via.placeholder.com/38?text=U'">` :
                            `<div class="rounded-circle bg-secondary text-white d-inline-flex align-items-center justify-content-center me-2" style="width:38px;height:38px;"><i class="fas fa-user"></i></div>`;
                        html += `
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                ${photoHtml}
                                <div>
                                    <strong>${escapeHtml(member.full_name)}</strong><br>
                                    <small class="text-muted">${escapeHtml(member.member_id)}</small>
                                </div>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-primary rounded-pill"><i class="far fa-clock"></i> ${member.duration_minutes} min</span><br>
                                <small class="text-secondary">since ${member.check_in_time ? member.check_in_time.split(' ')[1] : '--'}</small>
                            </div>
                        </div>
                    `;
                    });
                    html += `</div>`;
                    currentInsideDiv.innerHTML = html;
                } else {
                    currentInsideDiv.innerHTML = `<div class="alert alert-warning m-3">Cannot fetch current members</div>`;
                }
            } catch (err) {
                console.error('loadCurrentInside error', err);
                currentInsideDiv.innerHTML = `<div class="alert alert-danger m-3">Network error loading members</div>`;
            }
        }

        // central function: process external ID using backend API /api/scan_rfid (works with member_id / RFID)
        async function processExternalScan(externalId) {
            if (!externalId || externalId.trim() === '') {
                showTemporaryError("Please enter or scan a valid External Card ID.");
                return false;
            }
            const cleanId = externalId.trim();
            // UI loading
            resultPanel.style.display = 'block';
            resultPanel.innerHTML = `<div class="text-center p-3"><div class="spinner-border text-primary"></div><p class="mt-2">Verifying card ID ...</p></div>`;

            try {
                // we use the same /api/scan_rfid endpoint, which accepts RFID_UID or member_id (external member id)
                const response = await fetch('/api/scan_rfid', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rfid_uid: cleanId })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    // success check in / out
                    displaySuccessResult(data);
                    playBeep(data.action === 'check_in' ? 'check_in' : 'check_out');
                    loadCurrentInside();  // refresh inside list
                    setTimeout(() => {
                        // auto clear result after 4 seconds but keep summary?
                        if (resultPanel) {
                            setTimeout(() => {
                                if (resultPanel.innerHTML.includes('Welcome') || resultPanel.innerHTML.includes('Goodbye')) {
                                    resultPanel.style.display = 'none';
                                }
                            }, 3500);
                        }
                    }, 500);
                    scanInput.value = '';
                    scanInput.focus();
                    return true;
                }
                else if (data.is_expired === true) {
                    // expired membership
                    displayExpiredError(data);
                    playBeep('error');
                    loadCurrentInside();
                    return false;
                }
                else {
                    // other errors: member not found etc
                    let errMsg = data.message || 'Member not found or invalid ID.';
                    showTemporaryError(errMsg);
                    playBeep('error');
                    return false;
                }
            } catch (error) {
                console.error('scan error:', error);
                showTemporaryError('Connection error. Please try again.');
                playBeep('error');
                return false;
            }
        }

        function showTemporaryError(message) {
            resultPanel.style.display = 'block';
            resultPanel.innerHTML = `<div class="alert alert-danger border-0 shadow-sm rounded-4"><i class="fas fa-exclamation-triangle me-2"></i> ${escapeHtml(message)}</div>`;
            setTimeout(() => {
                if (resultPanel.innerHTML.includes('alert-danger')) resultPanel.style.display = 'none';
            }, 2800);
        }

        function displaySuccessResult(data) {
            const isCheckIn = (data.action === 'check_in');
            const cardIdDisplay = data.rfid_uid || '—';
            const expiryInfo = data.expiry_date ? `Valid until ${data.expiry_date}` : '';
            const daysRemaining = (data.days_remaining !== undefined && data.days_remaining !== null) ? `${data.days_remaining} days left` : '';
            const statusBadge = isCheckIn ?
                '<span class="badge-check bg-success text-white px-3 py-2 rounded-pill"><i class="fas fa-sign-in-alt"></i> CHECKED IN</span>' :
                '<span class="badge-check bg-warning text-dark px-3 py-2 rounded-pill"><i class="fas fa-sign-out-alt"></i> CHECKED OUT</span>';

            let durationHtml = '';
            if (data.action === 'check_out' && data.duration_minutes) {
                durationHtml = `<div class="mt-2 small bg-light p-2 rounded-3"><i class="far fa-hourglass"></i> Session: ${data.duration_minutes} minutes (from ${data.check_in_time || '--'} to ${data.check_out_time || '--'})</div>`;
            }
            let expiryWarning = '';
            if (data.days_remaining !== null && data.days_remaining <= 7 && data.days_remaining >= 0 && isCheckIn) {
                expiryWarning = `<div class="alert alert-warning mt-2 py-1 small"><i class="fas fa-clock"></i> Membership expires in ${data.days_remaining} days. Please renew soon.</div>`;
            }
            const photoHtml = data.photo_path ?
                `<img src="${data.photo_path}" class="rounded-circle border border-2 border-white shadow-sm" width="70" height="70" style="object-fit:cover;" onerror="this.src='https://via.placeholder.com/70?text=User'">` :
                `<div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white" style="width:70px;height:70px; font-size:2rem;"><i class="fas fa-user-circle"></i></div>`;

            const html = `
            <div class="status-card bg-white border rounded-4 p-3 shadow-sm animate__animated animate__fadeIn">
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <div class="text-center">${photoHtml}</div>
                    <div class="flex-grow-1">
                        <div class="mb-1">${statusBadge}</div>
                        <h5 class="mb-0">${escapeHtml(data.full_name)}</h5>
                        <div class="small text-muted">ID: ${escapeHtml(data.member_id)}</div>
                        ${cardIdDisplay !== '—' ? `<div class="small"><i class="fas fa-microchip"></i> Card: ${escapeHtml(cardIdDisplay)}</div>` : ''}
                        ${expiryInfo ? `<div class="small text-secondary">📅 ${escapeHtml(expiryInfo)} ${daysRemaining ? `(${daysRemaining})` : ''}</div>` : ''}
                        <div class="mt-2 alert ${isCheckIn ? 'alert-success' : 'alert-secondary'} py-1 px-2 mb-0 small fw-bold">${data.message}</div>
                        ${expiryWarning}
                        ${durationHtml}
                    </div>
                </div>
            </div>
        `;
            resultPanel.innerHTML = html;
            // auto-fade after 5 sec
            setTimeout(() => {
                if (resultPanel && resultPanel.style.display !== 'none') {
                    // keep but don't remove too soon if user reads
                }
            }, 100);
        }

        function displayExpiredError(data) {
            const photoHtml = data.photo_path ?
                `<img src="${data.photo_path}" width="60" height="60" class="rounded-circle">` :
                `<div class="rounded-circle bg-light d-inline-flex p-3"><i class="fas fa-user-slash fs-3"></i></div>`;
            const html = `
            <div class="status-card bg-white border border-danger rounded-4 p-3">
                <div class="d-flex gap-3 align-items-center">
                    ${photoHtml}
                    <div>
                        <span class="badge bg-danger mb-1"><i class="fas fa-ban"></i> EXPIRED MEMBERSHIP</span>
                        <h6 class="mb-0">${escapeHtml(data.full_name)}</h6>
                        <small>ID: ${escapeHtml(data.member_id)}</small>
                        <div class="alert alert-danger mt-2 py-1 mb-0 small">${data.message || 'Membership has expired. Please renew at front desk.'}</div>
                    </div>
                </div>
            </div>
        `;
            resultPanel.innerHTML = html;
            setTimeout(() => {
                if (resultPanel.innerHTML.includes('EXPIRED')) resultPanel.style.display = 'none';
            }, 4000);
        }

        // Submit manual or auto detect
        async function handleScan() {
            let rawValue = scanInput.value.trim();
            if (!rawValue) {
                showTemporaryError("Please enter/scan an external card number or Member ID.");
                scanInput.focus();
                return;
            }
            await processExternalScan(rawValue);
        }

        // Clear all
        function clearAll() {
            scanInput.value = '';
            resultPanel.style.display = 'none';
            scanInput.focus();
        }

        // auto-detect for USB RFID reader (simulate similar to scanner)
        let scanTimeout = null;
        scanInput.addEventListener('input', function (e) {
            clearTimeout(scanTimeout);
            const val = this.value.trim();
            if (val.length >= 6) {
                scanTimeout = setTimeout(() => {
                    if (val === scanInput.value.trim()) {
                        handleScan();
                    }
                }, 250);
            }
        });
        scanInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleScan();
            }
        });
        submitBtn.addEventListener('click', handleScan);
        clearBtn.addEventListener('click', clearAll);
        refreshBtn.addEventListener('click', () => loadCurrentInside());

        // Also assign optional event: add initial focus
        window.addEventListener('load', () => {
            loadCurrentInside();
            scanInput.focus();
            // add audio context initiation on first user interaction
            document.body.addEventListener('click', () => initAudio(), { once: true });
            // Any global listener to show realtime update of logs if needed.
            setInterval(() => {
                // Refresh current members every 25 seconds
                loadCurrentInside();
            }, 25000);
        });

        // Additional: provide a quick link to view full logs in same tab style
        const viewLogsLink = document.getElementById('viewFullLogsLink');
        if (viewLogsLink) {
            // keep original href but onclick friendly
            viewLogsLink.addEventListener('click', (e) => {
                // just use logs page, already works.
            });
        }

        // expose for external integration if needed
        window.refreshCurrentList = loadCurrentInside;
        window.processExternalScanApi = processExternalScan;

        // optionally show "external scan assigned" note. No RFID assign here, just entrance/exit.
    </script>
</body>

</html>
